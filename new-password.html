<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="new-password">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a href="verify.html" class="btn-back">&lt; Volver</a>
                <h2>Código Verificado</h2>
            </header>

            <div class="form-container">
                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="new-password-form" novalidate>
                    <div class="input-group">
                        <label for="new-pass">Ingrese su nueva contraseña</label>
                        <input type="password" id="new-pass" name="new-pass"
                               placeholder="mínimo 6 caracteres" autocomplete="new-password" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="new-pass-confirm">Reingrese su nueva contraseña</label>
                        <input type="password" id="new-pass-confirm" name="new-pass-confirm"
                               placeholder="contraseña" autocomplete="new-password" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <button type="submit" class="btn-primary">Actualizar contraseña</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
