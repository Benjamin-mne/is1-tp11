<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="verify">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a href="recovery.html" class="btn-back">&lt; Volver</a>
                <h2>Revisa tu e-mail</h2>
            </header>

            <div class="form-container">
                <p class="instruction-text">
                    Enviamos un código de recuperación a
                    <strong class="user-email-placeholder" id="verify-email">tu e-mail</strong>
                </p>

                <p class="mock-hint">
                    Como es un prototipo, este es el código recibido:
                    <strong id="mock-code">------</strong>
                </p>

                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="verify-form" novalidate>
                    <div class="otp-inputs" role="group" aria-label="Código de verificación">
                        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric"
                               required aria-label="Dígito 1">
                        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric"
                               required aria-label="Dígito 2">
                        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric"
                               required aria-label="Dígito 3">
                        <span class="otp-divider" aria-hidden="true">-</span>
                        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric"
                               required aria-label="Dígito 4">
                        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric"
                               required aria-label="Dígito 5">
                        <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric"
                               required aria-label="Dígito 6">
                    </div>

                    <button type="submit" class="btn-primary">Verificar Código</button>
                </form>

                <footer class="form-footer">
                    <p>¿No has recibido un mail? <a href="#" class="btn-link" id="resend-code">Reenviar código</a></p>
                </footer>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
