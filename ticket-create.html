<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ticket-create">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a href="helpdesk.html" class="btn-back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Volver</a>
                <h2>Carga de Ticket</h2>
            </header>

            <div class="form-container">
                <p class="instruction-text left-align">
                    A continuación se pedirá que complete con información sobre el problema que está experimentando.
                </p>

                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="create-form" novalidate>
                    <div class="input-group">
                        <label for="ticket-headline">Ingrese un encabezado</label>
                        <input type="text" id="ticket-headline" name="ticket-headline"
                               placeholder="Encabezado" autocomplete="off" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="ticket-description">Ingrese la descripción de su problema</label>
                        <textarea id="ticket-description" name="ticket-description" rows="6"
                                  placeholder="Descripción..." required></textarea>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <button type="submit" class="btn-primary margin-top-auto">Cargar Ticket</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/tickets.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
