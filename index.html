<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="hero-header">
                <div class="hero-overlay">
                    <h1>¿Problemas con el producto?</h1>
                    <p>Te ayudamos.</p>
                </div>
            </header>

            <div class="form-container">
                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="login-form" novalidate>
                    <div class="input-group">
                        <label for="login-email">Ingrese su e-mail</label>
                        <input type="email" id="login-email" name="login-email"
                               placeholder="email@example.com" autocomplete="email" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="login-pass">Ingrese su contraseña</label>
                        <input type="password" id="login-pass" name="login-pass"
                               placeholder="contraseña" autocomplete="current-password" required>
                        <small class="field-error" aria-live="polite"></small>
                        <a href="recovery.html" class="forgot-password-link">¿Olvidó su contraseña?</a>
                    </div>

                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                </form>

                <p class="mock-hint">Cuenta de prueba: <code>demo@example.com</code> / <code>demo1234</code></p>

                <footer class="form-footer">
                    <p>¿No estás registrado? <a href="register.html">Registrarse</a></p>
                </footer>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
