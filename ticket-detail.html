<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ticket-detail">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a href="helpdesk.html" class="btn-back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Volver</a>
                <h2>Detalle de Ticket</h2>
            </header>

            <div class="form-container">
                <div class="ticket-detail-view">
                    <div class="detail-meta-id" id="detail-id">Ticket ------</div>
                    <h4 class="detail-title" id="detail-title">---</h4>

                    <p class="detail-body-text" id="detail-body">---</p>

                    <hr class="divider">

                    <div class="detail-info-row"><strong>Cliente:</strong> <span id="detail-client">---</span></div>
                    <div class="detail-info-row"><strong>Fecha de Carga:</strong> <span id="detail-date">---</span></div>
                    <div class="detail-info-row"><strong>Estado:</strong> <span id="detail-status"></span></div>
                </div>

                <div class="button-split-row">
                    <button id="cancel-ticket-btn" type="button" class="btn-danger-outline">
                        <span class="material-symbols-outlined" aria-hidden="true">cancel</span>
                        Cancelar Ticket
                    </button>
                    <a id="append-details-link" href="ticket-append.html" class="btn-primary-small">
                        <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
                        Agregar Detalles
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/tickets.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
