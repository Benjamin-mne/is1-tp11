<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Detalles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ticket-append">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a id="append-back" href="ticket-detail.html" class="btn-back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Volver</a>
                <h2>Agregar Detalles</h2>
            </header>

            <div class="form-container">
                <p class="instruction-text left-align">
                    A continuación añada nueva información que considere importante por el ticket:
                </p>

                <div class="ticket-preview-box">
                    <div class="preview-id" id="preview-id">Ticket ------</div>
                    <div class="preview-title" id="preview-title">---</div>
                    <p class="preview-snippet" id="preview-snippet">---</p>
                </div>

                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="append-form" novalidate>
                    <div class="input-group">
                        <label for="ticket-extra-details">Ingrese los detalles extra:</label>
                        <textarea id="ticket-extra-details" name="ticket-extra-details" rows="6"
                                  placeholder="Detalles..." required></textarea>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <button type="submit" class="btn-primary margin-top-auto">Agregar Detalles</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/tickets.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
