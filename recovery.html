<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="recovery">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a href="index.html" class="btn-back">&lt; Volver</a>
                <h2>Recuperación</h2>
            </header>

            <div class="form-container">
                <p class="instruction-text">
                    Ingrese su e-mail asociado para recibir un código de verificación
                    y seguir con la recuperación.
                </p>

                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="recovery-form" novalidate>
                    <div class="input-group">
                        <label for="recovery-email">Ingrese su e-mail</label>
                        <input type="email" id="recovery-email" name="recovery-email"
                               placeholder="email@example.com" autocomplete="email" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <button type="submit" class="btn-primary">Enviar Código</button>
                </form>

                <footer class="form-footer">
                    <a href="index.html" class="btn-link">Volver al inicio</a>
                </footer>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
