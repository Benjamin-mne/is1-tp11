<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
    <main class="mobile-auth-container">
        <div id="flash" class="flash-banner" role="status" aria-live="polite"></div>

        <section class="auth-screen">
            <header class="screen-header">
                <a href="index.html" class="btn-back">&lt; Volver</a>
                <h2>Registrar</h2>
            </header>

            <div class="form-container">
                <p id="form-message" class="form-message" role="alert" hidden></p>

                <form id="register-form" novalidate>
                    <div class="input-group">
                        <label for="reg-email">Ingrese su e-mail</label>
                        <input type="email" id="reg-email" name="reg-email"
                               placeholder="email@example.com" autocomplete="email" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="reg-pass">Ingrese su contraseña</label>
                        <input type="password" id="reg-pass" name="reg-pass"
                               placeholder="mínimo 6 caracteres" autocomplete="new-password" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <div class="input-group">
                        <label for="reg-pass-confirm">Reingrese su contraseña</label>
                        <input type="password" id="reg-pass-confirm" name="reg-pass-confirm"
                               placeholder="contraseña" autocomplete="new-password" required>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <div class="input-group checkbox-group">
                        <input type="checkbox" id="reg-terms" name="reg-terms">
                        <label for="reg-terms">Acepto los <a href="#">términos y condiciones</a></label>
                        <small class="field-error" aria-live="polite"></small>
                    </div>

                    <button type="submit" class="btn-primary">Registrarse</button>
                </form>

                <footer class="form-footer">
                    <p>¿Ya estás registrado? <a href="index.html">Iniciar Sesión</a></p>
                </footer>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
